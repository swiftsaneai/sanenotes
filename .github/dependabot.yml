version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /app/android
    schedule: { interval: weekly }
  - package-ecosystem: swift
    directory: /app/ios
    schedule: { interval: weekly }
