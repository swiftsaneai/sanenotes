name: Flutter application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Exact golden baselines use the macOS font rasterizer.
    runs-on: macos-15
    env:
      SANE_GOLDEN_REFERENCE: macos15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read canonical Flutter pin
        id: sdk
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - name: Verify workspace
        run: ./tools/scripts/verify.sh
      - name: Preserve visual regression evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: packages/sane_ui/test/failures
          if-no-files-found: ignore
      - name: Build web with local renderer assets
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --no-pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanenotes-web-preview
          path: app/build/web
