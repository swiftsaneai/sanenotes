name: Flutter application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Exact golden baselines use the macOS font rasterizer.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read canonical Flutter pin
        id: sdk
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - name: Verify workspace
        run: ./tools/scripts/verify.sh
      - name: Build web with local renderer assets
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanenotes-web-preview
          path: app/build/web
