name: DevSecOps

# Shift-left security gates. See docs/security/devsecops-pipeline.md for the full design and
# docs/security/ssdlc-process.md for which gate belongs to which SDLC phase.
#
# Scanners that cannot yet find anything to scan (no dependency manifests until the Flutter
# scaffold lands in M0) are non-blocking today and become blocking in SN-CI-003. Tools are invoked
# via pinned container images rather than marketplace actions so that a moved tag cannot break or
# silently weaken the pipeline.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly full scan

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks over full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: gitleaks.sarif }
        continue-on-error: true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/secrets --config p/javascript --config p/kotlin --config p/swift --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }
        continue-on-error: true

  sca:
    name: Dependency vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Non-blocking until the Flutter scaffold adds pubspec.lock / Podfile.lock / gradle files
      # (SN-FND-002). Becomes a required check in SN-CI-003.
      - name: Scan for known-vulnerable dependencies
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.1 \
            scan --recursive --skip-git /src || echo "osv-scanner found no lockfiles or reported findings (non-blocking at this stage)"

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
        # Requires the Dependency graph to be enabled on the repository; non-blocking until it is.
        continue-on-error: true

  iac-and-fs:
    name: Filesystem & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
        continue-on-error: true

  actions-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  issues-schema:
    name: Issue files valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Fails only on structural errors. Dangling cross-references are reported as warnings.
      - run: node scripts/validate-issues.mjs --stats
