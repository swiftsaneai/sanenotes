name: sanenotes_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - app
  - packages/sane_audio
  - packages/sane_billing
  - packages/sane_brushes
  - packages/sane_core
  - packages/sane_crypto
  - packages/sane_ink
  - packages/sane_ml
  - packages/sane_pdf
  - packages/sane_render
  - packages/sane_search
  - packages/sane_sync
  - packages/sane_ui
dev_dependencies:
  analyzer: ^13.3.0
  melos: ^7.0.0
  path: ^1.9.1
  test: ^1.31.1
  very_good_analysis: ^11.0.0
  yaml: ^3.1.3
melos:
  scripts:
    analyze: dart analyze --fatal-infos
    format: dart format --output=none --set-exit-if-changed app/lib app/test packages
    test: dart run melos run test:flutter && dart run melos run test:core && dart test tools/scripts/test
    test:flutter: dart run melos exec --concurrency=1 --flutter --dir-exists=test -- flutter test
    test:core: dart run melos exec --concurrency=1 --no-flutter --dir-exists=test -- dart test
